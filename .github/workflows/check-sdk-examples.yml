name: Validate SDK examples

on:
  pull_request:
    paths:
      - openapi.sdk.overlay.json
      - scripts/*sdk-examples.mjs
      - .github/workflows/*sdk-examples.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - runs-on
      - runner=2cpu-linux-x64
      - env=prod
    timeout-minutes: 10
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate examples against their npm release
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("openapi.sdk.overlay.json", "utf8")).info.version')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          npm install --prefix "$RUNNER_TEMP/sdk-consumer" --ignore-scripts --no-audit --no-fund "@tembo-io/sdk@$VERSION" typescript@6.0.3
          node scripts/validate-sdk-examples.mjs "$RUNNER_TEMP/sdk-consumer"
